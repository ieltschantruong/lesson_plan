<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Chan Truong | Lesson 17</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #fff1f2; /* soft rose-50 */
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .timer-text { font-variant-numeric: tabular-nums; }
        
        /* Elegant Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #ffe4e6; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #fb7185; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f43f5e; }

        /* Glassmorphism utilities */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Inline Answer Toggle Utilities */
        .blank-ans { display: none; }
        .show-answers .blank-dots { display: none; }
        .show-answers .blank-ans { display: inline-block; animation: fadeIn 0.3s forwards; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-800">

    <!-- Elegant Header -->
    <header id="app-header" class="text-white p-4 shadow-lg transition-colors duration-700 z-20 relative bg-gradient-to-r from-rose-400 via-pink-500 to-fuchsia-500">
        <div class="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmYiLz48L3N2Zz4=')]"></div>
        
        <div class="max-w-7xl mx-auto flex justify-between items-center relative z-10">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="bg-white/20 text-white text-xs font-bold px-2 py-0.5 rounded uppercase tracking-wider backdrop-blur-sm">Band 6.5 - 7.5</span>
                    <span class="bg-white/20 text-white text-xs font-bold px-2 py-0.5 rounded uppercase tracking-wider backdrop-blur-sm">Lesson 17</span>
                </div>
                <h1 class="text-2xl font-bold tracking-tight drop-shadow-sm flex items-center gap-2">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    IELTS Chan Truong
                </h1>
                <h2 id="slide-title" class="text-sm font-medium mt-1 text-rose-50">Loading session...</h2>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-3">
                <a href="https://fliphtml5.com/hzqxv/eoia/Complete_6.5-7.5_Workbook/" target="_blank" class="flex items-center space-x-2 text-sm font-semibold bg-white/20 hover:bg-white/30 transition-all px-3 sm:px-4 py-2 rounded-full focus:outline-none backdrop-blur-md shadow-sm border border-white/20 text-white" title="Complete IELTS 6.5-7.5 Workbook">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    <span class="hidden sm:inline">Workbook</span>
                </a>

                <div class="relative">
                    <button id="nav-toggle-btn" class="flex items-center space-x-2 text-sm font-semibold bg-white/20 hover:bg-white/30 transition-all px-3 sm:px-5 py-2 rounded-full focus:outline-none backdrop-blur-md shadow-sm border border-white/20">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        <span class="hidden sm:inline">Sections</span>
                    </button>
                    
                    <div id="nav-dropdown" class="hidden absolute right-0 mt-3 w-80 bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl border border-rose-100 overflow-hidden z-50 origin-top-right transition-all fade-in">
                        <div class="p-3 bg-rose-50 border-b border-rose-100">
                            <p class="text-xs font-bold text-rose-800 uppercase tracking-wider text-center">Lesson Agenda</p>
                        </div>
                        <div class="max-h-[60vh] overflow-y-auto p-2" id="nav-menu-list"></div>
                    </div>
                </div>

                <div class="hidden sm:flex items-center space-x-2 text-sm font-bold text-rose-900 bg-white px-4 py-2 rounded-full shadow-sm">
                    <svg class="w-4 h-4 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>90 Mins</span>
                </div>
            </div>
        </div>
        
        <div class="max-w-7xl mx-auto mt-5 bg-black/10 rounded-full h-1.5 overflow-hidden relative z-10">
            <div id="progress-bar" class="bg-white h-full transition-all duration-700 ease-out shadow-[0_0_10px_rgba(255,255,255,0.8)]" style="width: 0%"></div>
        </div>
    </header>

    <main class="flex-grow overflow-y-auto relative p-4 md:p-8">
        <div id="content-container" class="max-w-6xl mx-auto"></div>
    </main>

    <footer class="bg-white/80 backdrop-blur-md border-t border-rose-100 p-4 md:px-10 z-10 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.02)]">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <button id="btn-prev" class="px-6 py-2.5 rounded-xl border border-rose-200 text-rose-600 font-semibold hover:bg-rose-50 hover:border-rose-300 transition-all disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                Previous
            </button>
            
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-rose-400 animate-pulse"></div>
                <div id="step-indicator" class="text-sm font-semibold text-rose-800 uppercase tracking-wide">
                    Section 1 of X
                </div>
                <div class="w-2 h-2 rounded-full bg-rose-400 animate-pulse delay-75"></div>
            </div>

            <button id="btn-next" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-pink-500 text-white font-semibold hover:from-rose-600 hover:to-pink-600 shadow-md hover:shadow-lg transition-all flex items-center gap-2 transform hover:-translate-y-0.5">
                Next
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </footer>

<script>
    // --- TIMER LOGIC ---
    let timers = {
        prep1: { interval: null, remaining: 60, isRunning: false },
        speak1: { interval: null, remaining: 120, isRunning: false },
        prep2: { interval: null, remaining: 60, isRunning: false },
        speak2: { interval: null, remaining: 120, isRunning: false }
    };

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimerUI(id, seconds) {
        const displayEl = document.getElementById(`${id}-timer`);
        if (displayEl) displayEl.textContent = formatTime(seconds);
    }

    window.toggleTimer = function(id, defaultTime) {
        const timer = timers[id];
        const btn = document.getElementById(`btn-${id}-timer`);
        
        if (timer.isRunning) {
            clearInterval(timer.interval);
            timer.isRunning = false;
            if(btn) btn.textContent = 'Resume';
        } else {
            if (timer.remaining <= 0) timer.remaining = defaultTime;
            
            timer.isRunning = true;
            if(btn) btn.textContent = 'Pause';
            
            timer.interval = setInterval(() => {
                timer.remaining--;
                updateTimerUI(id, timer.remaining);
                
                if (timer.remaining <= 0) {
                    clearInterval(timer.interval);
                    timer.isRunning = false;
                    if(btn) btn.textContent = 'Time Up!';
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const playBeep = (st) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.frequency.setValueAtTime(800, st);
                            gain.gain.setValueAtTime(0.1, st);
                            osc.start(st);
                            gain.gain.exponentialRampToValueAtTime(0.00001, st + 0.3);
                            osc.stop(st + 0.3);
                        };
                        playBeep(ctx.currentTime);
                        playBeep(ctx.currentTime + 0.4);
                    } catch(e) {}
                }
            }, 1000);
        }
    };

    window.resetTimer = function(id, defaultTime) {
        const timer = timers[id];
        clearInterval(timer.interval);
        timer.isRunning = false;
        timer.remaining = defaultTime;
        updateTimerUI(id, defaultTime);
        const btn = document.getElementById(`btn-${id}-timer`);
        if(btn) btn.textContent = 'Start';
    };

    function pauseAllTimers() {
        Object.keys(timers).forEach(key => {
            if (timers[key].isRunning) {
                clearInterval(timers[key].interval);
                timers[key].isRunning = false;
            }
        });
    }

    // --- DATA STRUCTURE ---
    const sessionData = [
        {
            id: 'listening_wb_u5',
            type: 'Listening',
            themeClass: 'bg-gradient-to-r from-rose-400 to-pink-500',
            iconColor: 'text-rose-500',
            title: '1. Listening Unit 5 WB',
            content: `
                <div class="fade-in bg-white rounded-3xl shadow-xl border border-rose-50 p-5 md:p-6 flex flex-col" style="height: calc(100vh - 11rem); min-height: 650px;">
                    <div class="flex items-center gap-4 mb-4 border-b border-gray-100 pb-4 shrink-0">
                        <div class="w-12 h-12 rounded-2xl bg-rose-100 flex items-center justify-center text-rose-600 flex-shrink-0">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                        </div>
                        <div class="flex-grow flex flex-col md:flex-row justify-between md:items-center gap-4">
                            <div>
                                <div class="flex items-center gap-3 mb-1 flex-wrap">
                                    <h3 class="text-xl font-bold text-gray-800">Listening Practice</h3>
                                    <a href="https://ieltschantruong.github.io/IELTS/learning_resources/listening/mock_test/section3_complete_ielts_6.5_7.5_wb_unit5.html" target="_blank" class="inline-flex items-center gap-1.5 text-rose-600 hover:text-white hover:bg-rose-600 transition-colors px-3 py-1.5 bg-rose-50 hover:bg-rose-500 rounded-lg shadow-sm border border-rose-200 text-sm font-bold" title="Open in new tab">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                        Open in New Tab
                                    </a>
                                </div>
                                <p class="text-rose-600 font-medium text-sm">Unit 5 WB | Complete IELTS</p>
                            </div>
                            <button onclick="toggleVisibility('ans-wb-u5')" class="bg-rose-50 text-rose-700 px-4 py-2 rounded-xl font-bold hover:bg-rose-100 transition-colors text-sm border border-rose-200 flex items-center gap-2 shrink-0 shadow-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                Show Answers
                            </button>
                        </div>
                    </div>

                    <div id="ans-wb-u5" class="hidden mb-4 bg-gray-50 border border-rose-100 rounded-xl p-5 shrink-0 shadow-inner transition-all fade-in">
                        <h4 class="font-bold text-rose-800 mb-3 border-b border-rose-100 pb-2 uppercase tracking-wide text-xs">Answer Key</h4>
                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-sm text-gray-700 font-medium">
                            <div class="bg-white p-2.5 rounded-lg border border-gray-100 shadow-sm"><span class="text-rose-500 font-bold mr-2">1</span> B</div>
                            <div class="bg-white p-2.5 rounded-lg border border-gray-100 shadow-sm"><span class="text-rose-500 font-bold mr-2">2</span> A</div>
                            <div class="bg-white p-2.5 rounded-lg border border-gray-100 shadow-sm"><span class="text-rose-500 font-bold mr-2">3</span> C</div>
                            <div class="bg-white p-2.5 rounded-lg border border-gray-100 shadow-sm"><span class="text-rose-500 font-bold mr-2">4</span> B</div>
                            <div class="bg-white p-2.5 rounded-lg border border-gray-100 shadow-sm"><span class="text-rose-500 font-bold mr-2">5</span> A</div>
                            <div class="bg-white p-2.5 rounded-lg border border-gray-100 shadow-sm"><span class="text-rose-500 font-bold mr-2">6</span> tribes</div>
                            <div class="bg-white p-2.5 rounded-lg border border-gray-100 shadow-sm"><span class="text-rose-500 font-bold mr-2">7</span> separated</div>
                            <div class="bg-white p-2.5 rounded-lg border border-gray-100 shadow-sm"><span class="text-rose-500 font-bold mr-2">8</span> permanent</div>
                            <div class="bg-white p-2.5 rounded-lg border border-gray-100 shadow-sm"><span class="text-rose-500 font-bold mr-2">9</span> stages</div>
                            <div class="bg-white p-2.5 rounded-lg border border-gray-100 shadow-sm"><span class="text-rose-500 font-bold mr-2">10</span> sophisticated</div>
                        </div>
                    </div>

                    <div class="w-full flex-grow rounded-2xl overflow-hidden border border-gray-200 shadow-inner bg-gray-50 relative">
                        <iframe src="https://ieltschantruong.github.io/IELTS/learning_resources/listening/mock_test/section3_complete_ielts_6.5_7.5_wb_unit5.html" class="absolute inset-0 w-full h-full border-0" title="Listening Practice"></iframe>
                    </div>
                </div>
            `
        }
    ];

    let currentIndex = 0;

    const headerEl = document.getElementById('app-header');
    const titleEl = document.getElementById('slide-title');
    const containerEl = document.getElementById('content-container');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const indicatorEl = document.getElementById('step-indicator');
    const progressBarEl = document.getElementById('progress-bar');
    const navDropdown = document.getElementById('nav-dropdown');
    const navMenuList = document.getElementById('nav-menu-list');

    window.addEventListener('DOMContentLoaded', () => {
        populateNavMenu();
        
        document.getElementById('nav-toggle-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            navDropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!navDropdown.contains(e.target) && !document.getElementById('nav-toggle-btn').contains(e.target)) {
                navDropdown.classList.add('hidden');
            }
        });

        if(prevBtn) {
            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) renderSlide(--currentIndex);
            });
        }

        if(nextBtn) {
            nextBtn.addEventListener('click', () => {
                if (currentIndex < sessionData.length - 1) {
                    renderSlide(++currentIndex);
                } else {
                    alert("Lesson 17 Completed! Excellent work today.");
                }
            });
        }

        renderSlide(0);
    });

    function populateNavMenu() {
        if(!navMenuList) return;
        navMenuList.innerHTML = sessionData.map((data, index) => `
            <button onclick="goToSlide(${index})" class="nav-item-btn w-full text-left p-3 mb-1 rounded-xl hover:bg-white transition-all flex items-center gap-3 border border-transparent shadow-sm">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 text-sm font-bold text-white shadow-sm ${data.themeClass || ''}">
                    ${index + 1}
                </div>
                <div>
                    <div class="text-sm font-bold text-gray-800 leading-tight">${data.title ? data.title.substring(3) : 'Section ' + (index + 1)}</div>
                    <div class="text-[10px] font-bold uppercase tracking-wider ${data.iconColor || ''}">${data.type || 'Lesson'}</div>
                </div>
            </button>
        `).join('');
    }

    window.goToSlide = function(index) {
        currentIndex = index;
        renderSlide(currentIndex);
        if(navDropdown) navDropdown.classList.add('hidden');
    };

    function renderSlide(index) {
        pauseAllTimers();
        const data = sessionData[index];
        if(!headerEl || !titleEl || !containerEl) return;
        
        headerEl.className = `text-white p-4 shadow-lg transition-colors duration-700 z-20 relative ${data.themeClass}`;
        titleEl.textContent = data.title;
        
        const progressPercent = ((index + 1) / sessionData.length) * 100;
        if(progressBarEl) progressBarEl.style.width = `${progressPercent}%`;
        if(indicatorEl) indicatorEl.textContent = `Section ${index + 1} of ${sessionData.length}`;

        document.querySelectorAll('.nav-item-btn').forEach((btn, i) => {
            if (i === index) {
                btn.classList.add('bg-white', 'border-rose-200', 'shadow-md');
                btn.classList.remove('border-transparent', 'shadow-sm');
            } else {
                btn.classList.remove('bg-white', 'border-rose-200', 'shadow-md');
                btn.classList.add('border-transparent', 'shadow-sm');
            }
        });

        containerEl.innerHTML = ''; 
        setTimeout(() => {
            containerEl.innerHTML = data.content;
            
            // Restore timers visually if returning to slide
            if(data.id === 'speaking_u8_1') {
                updateTimerUI('prep1', timers.prep1.remaining);
                updateTimerUI('speak1', timers.speak1.remaining);
            }
            if(data.id === 'speaking_u8_2') {
                updateTimerUI('prep2', timers.prep2.remaining);
                updateTimerUI('speak2', timers.speak2.remaining);
            }
        }, 10);

        if(prevBtn) prevBtn.disabled = index === 0;
        if(nextBtn) nextBtn.innerHTML = index === sessionData.length - 1 ? 
            'Finish Lesson <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : 
            'Next Section <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
    }

    window.toggleInlineAnswers = function(containerId, btnId) {
        const container = document.getElementById(containerId);
        const btn = document.getElementById(btnId);
        if(container) {
            container.classList.toggle('show-answers');
            
            // Highlight the container slightly when answers are shown
            if(container.classList.contains('show-answers')) {
                container.classList.add('shadow-md', 'border-emerald-300');
                container.classList.remove('shadow-sm', 'border-rose-100');
            } else {
                container.classList.remove('shadow-md', 'border-emerald-300');
                container.classList.add('shadow-sm', 'border-rose-100');
            }

            // Update button text and style
            if(btn) {
                btn.textContent = container.classList.contains('show-answers') ? 'Hide Answers' : 'Show Answers';
                btn.classList.toggle('bg-white');
                btn.classList.toggle('bg-emerald-100');
            }
        }
    };

    window.toggleVisibility = function(id) {
        const el = document.getElementById(id);
        if(el) {
            if(el.classList.contains('hidden')){
                el.classList.remove('hidden');
                el.classList.add('fade-in');
                setTimeout(() => { el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
            } else {
                el.classList.add('hidden');
                el.classList.remove('fade-in');
            }
        }
    };
</script>
</body>
</html>
