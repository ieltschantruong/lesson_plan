    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimerUI(id, seconds) {
        const displayEl = document.getElementById(`${id}-timer`);
        if (displayEl) displayEl.textContent = formatTime(seconds);
    }

    function toggleTimer(id, defaultTime) {
        const timer = timers[id];
        const btn = document.getElementById(`btn-${id}-timer`);
        
        if (timer.isRunning) {
            clearInterval(timer.interval);
            timer.isRunning = false;
            if(btn) btn.textContent = 'Resume';
        } else {
            if (timer.remaining <= 0) timer.remaining = defaultTime;
            
            timer.isRunning = true;
            if(btn) btn.textContent = 'Pause';
            
            timer.interval = setInterval(() => {
                timer.remaining--;
                updateTimerUI(id, timer.remaining);
                
                if (timer.remaining <= 0) {
                    clearInterval(timer.interval);
                    timer.isRunning = false;
                    if(btn) btn.textContent = 'Time Up!';
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const playBeep = (st) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.frequency.setValueAtTime(800, st);
                            gain.gain.setValueAtTime(0.1, st);
                            osc.start(st);
                            gain.gain.exponentialRampToValueAtTime(0.00001, st + 0.3);
                            osc.stop(st + 0.3);
                        };
                        playBeep(ctx.currentTime);
                        playBeep(ctx.currentTime + 0.4);
                    } catch(e) {}
                }
            }, 1000);
        }
    }

                                    <button onclick="toggleVisibility('p3-u3-4')" class="text-xs font-bold text-teal-600 bg-teal-100 hover:bg-teal-200 px-4 py-2 rounded-lg transition-colors whitespace-nowrap shadow-sm">Sample</button>
                                </div>
                                <div id="p3-u3-4" class="hidden bg-white border-l-4 border-teal-400 p-4 rounded-r-lg shadow-sm mt-3">
                                    <div class="space-y-2">
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-teal-600 uppercase tracking-wider not-italic mr-1 bg-teal-50 px-1 py-0.5 rounded border border-teal-100">[Direct Answer]</span> "Schools can organize a variety of engaging physical programs beyond standard PE classes."</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-teal-600 uppercase tracking-wider not-italic mr-1 bg-teal-50 px-1 py-0.5 rounded border border-teal-100">[Detail]</span> For example, they could host monthly mini-marathons, obstacle courses, or intramural sports leagues.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-teal-600 uppercase tracking-wider not-italic mr-1 bg-teal-50 px-1 py-0.5 rounded border border-teal-100">[Reason]</span> These activities build physical <span class="font-semibold text-teal-600">stamina</span> in a fun way, ensuring kids remain <span class="font-semibold text-teal-600">full of beans</span> rather than seeing exercise as a chore."</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-teal-600 uppercase tracking-wider not-italic mr-1 bg-teal-50 px-1 py-0.5 rounded border border-teal-100">[Conclusion]</span> By integrating such diverse activities, schools can effectively cultivate lifelong healthy habits."</p>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-2xl p-5 border border-gray-200">
                                <div class="flex justify-between items-start gap-4 mb-3">
                                    <p class="font-bold text-gray-800 text-lg">5. Do you think people are healthier now than in the past?</p>
                                    <button onclick="toggleVisibility('p3-u3-5')" class="text-xs font-bold text-teal-600 bg-teal-100 hover:bg-teal-200 px-4 py-2 rounded-lg transition-colors whitespace-nowrap shadow-sm">Sample</button>
                                </div>
                                <div id="p3-u3-5" class="hidden bg-white border-l-4 border-teal-400 p-4 rounded-r-lg shadow-sm mt-3">
                                    <div class="space-y-2">
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-teal-600 uppercase tracking-wider not-italic mr-1 bg-teal-50 px-1 py-0.5 rounded border border-teal-100">[Direct Answer]</span> "It is a bit of a paradox, honestly."</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-teal-600 uppercase tracking-wider not-italic mr-1 bg-teal-50 px-1 py-0.5 rounded border border-teal-100">[Yes]</span> Medically, we are healthier; advancements allow us to treat <span class="font-semibold text-teal-600">malignant</span> diseases and increase human <span class="font-semibold text-teal-600">longevity</span> significantly.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-teal-600 uppercase tracking-wider not-italic mr-1 bg-teal-50 px-1 py-0.5 rounded border border-teal-100">[No]</span> Conversely, our modern, sedentary lifestyles and poor diets make us more <span class="font-semibold text-teal-600">susceptible</span> to chronic issues like obesity or <span class="font-semibold text-teal-600">asthma</span> compared to our highly active ancestors."</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-teal-600 uppercase tracking-wider not-italic mr-1 bg-teal-50 px-1 py-0.5 rounded border border-teal-100">[Conclusion]</span> So, while we live longer, the quality of our daily physical health is certainly debatable."</p>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-2xl p-5 border border-gray-200">
                                <div class="flex justify-between items-start gap-4 mb-3">
                                    <p class="font-bold text-gray-800 text-lg">6. Are there enough places for sports activities in your country?</p>
                                    <button onclick="toggleVisibility('p3-u3-6')" class="text-xs font-bold text-teal-600 bg-teal-100 hover:bg-teal-200 px-4 py-2 rounded-lg transition-colors whitespace-nowrap shadow-sm">Sample</button>
                                </div>
                                <div id="p3-u3-6" class="hidden bg-white border-l-4 border-teal-400 p-4 rounded-r-lg shadow-sm mt-3">
                                    <div class="space-y-2">
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-teal-600 uppercase tracking-wider not-italic mr-1 bg-teal-50 px-1 py-0.5 rounded border border-teal-100">[Direct Answer]</span> "Unfortunately, I don't think there are enough, particularly in urban areas."</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-teal-600 uppercase tracking-wider not-italic mr-1 bg-teal-50 px-1 py-0.5 rounded border border-teal-100">[Detail]</span> While commercial gyms are <span class="font-semibold text-teal-600">prevalent</span>, they are not affordable for everyone. Free, public spaces like community sports fields are shrinking due to rapid urbanization.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-teal-600 uppercase tracking-wider not-italic mr-1 bg-teal-50 px-1 py-0.5 rounded border border-teal-100">[Conclusion]</span> This lack of infrastructure is a real barrier for citizens trying to maintain their physical <span class="font-semibold text-teal-600">vitality</span>."</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `
        }
    ];

    let currentIndex = 0;

    const headerEl = document.getElementById('app-header');
    const titleEl = document.getElementById('slide-title');
    const containerEl = document.getElementById('content-container');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const indicatorEl = document.getElementById('step-indicator');
    const progressBarEl = document.getElementById('progress-bar');
    const navDropdown = document.getElementById('nav-dropdown');
    const navMenuList = document.getElementById('nav-menu-list');

    function populateNavMenu() {
        navMenuList.innerHTML = sessionData.map((data, index) => `
            <button onclick="goToSlide(${index})" class="nav-item-btn w-full text-left p-3 mb-1 rounded-xl hover:bg-white transition-all flex items-center gap-3 border border-transparent shadow-sm">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 text-sm font-bold text-white shadow-sm ${data.themeClass}">
                    ${index + 1}
                </div>
                <div>
                    <div class="text-sm font-bold text-gray-800 leading-tight">${data.title.substring(3)}</div>
                    <div class="text-[10px] font-bold uppercase tracking-wider ${data.iconColor}">${data.type}</div>
                </div>
            </button>
        `).join('');
    }

    window.goToSlide = function(index) {
        currentIndex = index;
        renderSlide(currentIndex);
        navDropdown.classList.add('hidden');
    };

    document.getElementById('nav-toggle-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        navDropdown.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
        if (!navDropdown.contains(e.target) && !document.getElementById('nav-toggle-btn').contains(e.target)) {
            navDropdown.classList.add('hidden');
        }
    });

    function showCompletionMessage() {
        const overlay = document.createElement('div');
        overlay.id = "completion-overlay";
        overlay.className = 'fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 flex items-center justify-center fade-in';
        
        const toast = document.createElement('div');
        toast.className = 'bg-white text-gray-800 p-8 rounded-3xl shadow-2xl flex flex-col items-center gap-4 text-center max-w-sm border border-gray-100 transform transition-all';
        toast.innerHTML = `
            <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-500 mb-2 shadow-inner">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-2xl font-black text-gray-800">Lesson Completed!</h2>
            <p class="font-medium text-gray-500">Great job on finishing Lesson 11. You can review the sections from the menu.</p>
            <button onclick="document.getElementById('completion-overlay').remove()" class="mt-4 w-full px-6 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors shadow-sm">Close</button>
        `;
        
        overlay.appendChild(toast);
        document.body.appendChild(overlay);
    }

    function renderSlide(index) {
        if (typeof pauseAllTimers === 'function') pauseAllTimers();
        const data = sessionData[index];
        
        headerEl.className = `text-white p-4 shadow-lg transition-colors duration-700 z-20 relative ${data.themeClass}`;
        titleEl.textContent = data.title;
        
        const progressPercent = ((index + 1) / sessionData.length) * 100;
        progressBarEl.style.width = `${progressPercent}%`;
        indicatorEl.textContent = `Section ${index + 1} of ${sessionData.length}`;

        document.querySelectorAll('.nav-item-btn').forEach((btn, i) => {
            if (i === index) {
                btn.classList.add('bg-white', 'shadow-md');
                btn.classList.remove('border-transparent', 'shadow-sm');
            } else {
                btn.classList.remove('bg-white', 'shadow-md');
                btn.classList.add('border-transparent', 'shadow-sm');
            }
        });

        containerEl.innerHTML = ''; 
        setTimeout(() => {
            containerEl.innerHTML = data.content;
            if(data.id === 'speaking_practice_u3') {
                updateTimerUI('prep', timers.prep.remaining);
                updateTimerUI('speak', timers.speak.remaining);
                updateTimerUI('prep2', timers.prep2.remaining);
                updateTimerUI('speak2', timers.speak2.remaining);
            }
        }, 10);

        prevBtn.disabled = index === 0;
        nextBtn.innerHTML = index === sessionData.length - 1 ? 
            'Finish Lesson <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : 
            'Next Section <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
    }

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) renderSlide(--currentIndex);
    });

    nextBtn.addEventListener('click', () => {
        if (currentIndex < sessionData.length - 1) {
            renderSlide(++currentIndex);
        } else {
            showCompletionMessage();
        }
    });

    window.toggleVisibility = function(id) {
        const el = document.getElementById(id);
        if(el) {
            if(el.classList.contains('hidden')){
                el.classList.remove('hidden');
                el.classList.add('fade-in');
            } else {
                el.classList.add('hidden');
                el.classList.remove('fade-in');
            }
        }
    };

    window.toggleInlineAnswers = function(containerId, btnId) {
        const container = document.getElementById(containerId);
        const btn = document.getElementById(btnId);
        if(!container) return;
        
        const ansEls = container.querySelectorAll('.ans-inline');
        const blankEls = container.querySelectorAll('.blank-inline');
        
        let isShowing = false;
        
        ansEls.forEach(el => {
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                el.classList.add('fade-in');
                isShowing = true;
            } else {
                el.classList.add('hidden');
                el.classList.remove('fade-in');
                isShowing = false;
            }
        });
        
        blankEls.forEach(el => {
            if (isShowing) el.classList.add('hidden');
            else el.classList.remove('hidden');
        });
        
        if(btn) {
            btn.textContent = isShowing ? 'Hide Answers' : 'Show Answers';
        }
    };

    window.addEventListener('DOMContentLoaded', () => {
        populateNavMenu();
        renderSlide(0);
    });
</script>
</body>
</html>
