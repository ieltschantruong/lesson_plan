    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimerUI(id, seconds) {
        const displayEl = document.getElementById(`${id}-timer`);
        if (displayEl) displayEl.textContent = formatTime(seconds);
    }

    window.toggleTimer = function(id, defaultTime) {
        const timer = timers[id];
        const btn = document.getElementById(`btn-${id}-timer`);
        
        if (timer.isRunning) {
            clearInterval(timer.interval);
            timer.isRunning = false;
            if(btn) btn.textContent = 'Resume';
        } else {
            if (timer.remaining <= 0) timer.remaining = defaultTime;
            
            timer.isRunning = true;
            if(btn) btn.textContent = 'Pause';
            
            timer.interval = setInterval(() => {
                timer.remaining--;
                updateTimerUI(id, timer.remaining);
                
                if (timer.remaining <= 0) {
                    clearInterval(timer.interval);
                    timer.isRunning = false;
                    if(btn) btn.textContent = 'Time Up!';
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const playBeep = (st) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.frequency.setValueAtTime(800, st);
                            gain.gain.setValueAtTime(0.1, st);
                            osc.start(st);
                            gain.gain.exponentialRampToValueAtTime(0.00001, st + 0.3);
                            osc.stop(st + 0.3);
                        };
                        playBeep(ctx.currentTime);
                        playBeep(ctx.currentTime + 0.4);
                    } catch(e) {}
                }
            }, 1000);
        }
    };

    window.resetTimer = function(id, defaultTime) {
        const timer = timers[id];
        clearInterval(timer.interval);
        timer.isRunning = false;
        timer.remaining = defaultTime;
        updateTimerUI(id, defaultTime);
        const btn = document.getElementById(`btn-${id}-timer`);
        if(btn) btn.textContent = 'Start';
    };

        Object.keys(timers).forEach(key => {

                                <p class="text-sm text-gray-700 italic leading-relaxed">"I'd like to talk about a goal I set and achieved recently, which was passing a rigorous professional certification exam for my career. I set this goal because I wanted to turn over a new leaf professionally and advance to a senior position at my company. I knew this certificate was the key to unlocking those opportunities.<br><br>It was incredibly difficult to achieve. At first, I felt a bit disillusioned when I saw the sheer volume of material I had to cover. Cramming for the exam after working a full nine-to-five job was physically and mentally taxing. There were many weekends where I had to sacrifice socializing to stay home and study.<br><br>However, when I finally received the email saying I had passed, I gave an ecstatic sigh of relief. I felt like I was walking on air. All the grueling hours had finally panned out. It gave me a massive confidence boost and proved to me that setting my heart on a difficult goal and persevering truly pays off."</p>

                        <!-- Part 3 -->
                        <h3 class="text-2xl font-bold text-gray-800 mb-6 border-b border-gray-100 pb-4">Part 3: Discussion Questions</h3>
                        <div class="grid md:grid-cols-2 gap-4">
                            <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 shadow-sm">
                                <div class="flex justify-between items-start gap-2 mb-3">
                                    <p class="font-bold text-gray-800 text-[15px]"><span class="text-blue-600 mr-2">1.</span> What kinds of ambitions do people usually have?</p>
                                </div>
                                <button onclick="toggleVisibility('p3-q1')" class="text-[10px] font-bold text-blue-600 bg-blue-100 hover:bg-blue-200 px-3 py-1.5 rounded transition-colors mb-2">Show Sample</button>
                                <div id="p3-q1" class="hidden mt-2 pt-2 border-t border-gray-200">
                                    <p class="text-sm text-gray-600 italic leading-relaxed">"It varies greatly depending on their stage of life. Young people often have academic ambitions, like getting into a prestigious university. Adults usually focus on career progression, financial stability, or starting a family, while older individuals might aim for health and a peaceful retirement."</p>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 shadow-sm">
                                <div class="flex justify-between items-start gap-2 mb-3">
                                    <p class="font-bold text-gray-800 text-[15px]"><span class="text-blue-600 mr-2">2.</span> Who has the greater influence on goal-setting of children, parents or teacher?</p>
                                </div>
                                <button onclick="toggleVisibility('p3-q2')" class="text-[10px] font-bold text-blue-600 bg-blue-100 hover:bg-blue-200 px-3 py-1.5 rounded transition-colors mb-2">Show Sample</button>
                                <div id="p3-q2" class="hidden mt-2 pt-2 border-t border-gray-200">
                                    <p class="text-sm text-gray-600 italic leading-relaxed">"I believe parents have a more profound, foundational influence. They shape a child's core values and self-esteem from birth. While teachers definitely inspire and guide academic goals, parents typically provide the emotional support needed for a child to set and pursue long-term life ambitions."</p>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 shadow-sm">
                                <div class="flex justify-between items-start gap-2 mb-3">
                                    <p class="font-bold text-gray-800 text-[15px]"><span class="text-blue-600 mr-2">3.</span> Should parents set goals for children?</p>
                                </div>
                                <button onclick="toggleVisibility('p3-q3')" class="text-[10px] font-bold text-blue-600 bg-blue-100 hover:bg-blue-200 px-3 py-1.5 rounded transition-colors mb-2">Show Sample</button>
                                <div id="p3-q3" class="hidden mt-2 pt-2 border-t border-gray-200">
                                    <p class="text-sm text-gray-600 italic leading-relaxed">"Parents should guide rather than dictate. They can help children set realistic, short-term goals to teach them discipline and work ethic. However, forcing rigid, long-term goals on a child can lead to resentment; children need autonomy to discover their own passions."</p>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 shadow-sm">
                                <div class="flex justify-between items-start gap-2 mb-3">
                                    <p class="font-bold text-gray-800 text-[15px]"><span class="text-blue-600 mr-2">4.</span> Should parents stop their children when they have unrealistic ambitions?</p>
                                </div>
                                <button onclick="toggleVisibility('p3-q4')" class="text-[10px] font-bold text-blue-600 bg-blue-100 hover:bg-blue-200 px-3 py-1.5 rounded transition-colors mb-2">Show Sample</button>
                                <div id="p3-q4" class="hidden mt-2 pt-2 border-t border-gray-200">
                                    <p class="text-sm text-gray-600 italic leading-relaxed">"Not abruptly. Instead of crushing their dreams, parents should gently encourage them to explore the practical steps required to achieve that ambition. This helps the child realize the reality themselves, turning an unrealistic dream into a valuable learning experience rather than a failure."</p>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 shadow-sm">
                                <div class="flex justify-between items-start gap-2 mb-3">
                                    <p class="font-bold text-gray-800 text-[15px]"><span class="text-blue-600 mr-2">5.</span> When do young children start setting goal for themselves?</p>
                                </div>
                                <button onclick="toggleVisibility('p3-q5')" class="text-[10px] font-bold text-blue-600 bg-blue-100 hover:bg-blue-200 px-3 py-1.5 rounded transition-colors mb-2">Show Sample</button>
                                <div id="p3-q5" class="hidden mt-2 pt-2 border-t border-gray-200">
                                    <p class="text-sm text-gray-600 italic leading-relaxed">"I think very basic goal-setting starts as early as toddlerhood, like trying to build a tall block tower. More conscious, structured goal-setting usually begins around early primary school, when they start understanding concepts like saving allowance for a toy or practicing for a sports game."</p>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 shadow-sm">
                                <div class="flex justify-between items-start gap-2 mb-3">
                                    <p class="font-bold text-gray-800 text-[15px]"><span class="text-blue-600 mr-2">6.</span> What kinds of goals are not realistic?</p>
                                </div>
                                <button onclick="toggleVisibility('p3-q6')" class="text-[10px] font-bold text-blue-600 bg-blue-100 hover:bg-blue-200 px-3 py-1.5 rounded transition-colors mb-2">Show Sample</button>
                                <div id="p3-q6" class="hidden mt-2 pt-2 border-t border-gray-200">
                                    <p class="text-sm text-gray-600 italic leading-relaxed">"Goals that completely ignore one's current limitations or resources are unrealistic. For example, aiming to become an Olympic athlete within a year without prior training, or setting financial goals that require a sudden, miraculous windfall rather than steady effort."</p>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 shadow-sm">
                                <div class="flex justify-between items-start gap-2 mb-3">
                                    <p class="font-bold text-gray-800 text-[15px]"><span class="text-blue-600 mr-2">7.</span> Why do people set goals?</p>
                                </div>
                                <button onclick="toggleVisibility('p3-q7')" class="text-[10px] font-bold text-blue-600 bg-blue-100 hover:bg-blue-200 px-3 py-1.5 rounded transition-colors mb-2">Show Sample</button>
                                <div id="p3-q7" class="hidden mt-2 pt-2 border-t border-gray-200">
                                    <p class="text-sm text-gray-600 italic leading-relaxed">"Goals provide direction and a sense of purpose. They act as a roadmap, helping people prioritize their time and energy. Achieving goals also triggers a sense of accomplishment and boosts self-confidence, which motivates people to continue improving themselves."</p>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 shadow-sm">
                                <div class="flex justify-between items-start gap-2 mb-3">
                                    <p class="font-bold text-gray-800 text-[15px]"><span class="text-blue-600 mr-2">8.</span> Why is it important for teenagers to set goals?</p>
                                </div>
                                <button onclick="toggleVisibility('p3-q8')" class="text-[10px] font-bold text-blue-600 bg-blue-100 hover:bg-blue-200 px-3 py-1.5 rounded transition-colors mb-2">Show Sample</button>
                                <div id="p3-q8" class="hidden mt-2 pt-2 border-t border-gray-200">
                                    <p class="text-sm text-gray-600 italic leading-relaxed">"Teenage years are highly formative. Setting goals helps them develop focus and shields them from negative peer pressure or distractions. It teaches them crucial life skills like time management, resilience when they face setbacks, and how to take responsibility for their own future."</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `
        }
    ];

    let currentIndex = 0;

    const headerEl = document.getElementById('app-header');
    const titleEl = document.getElementById('slide-title');
    const containerEl = document.getElementById('content-container');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const indicatorEl = document.getElementById('step-indicator');
    const progressBarEl = document.getElementById('progress-bar');
    const navDropdown = document.getElementById('nav-dropdown');
    const navMenuList = document.getElementById('nav-menu-list');

    window.addEventListener('DOMContentLoaded', () => {
        populateNavMenu();
        
        document.getElementById('nav-toggle-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            navDropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!navDropdown.contains(e.target) && !document.getElementById('nav-toggle-btn').contains(e.target)) {
                navDropdown.classList.add('hidden');
            }
        });

        if(prevBtn) {
            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) renderSlide(--currentIndex);
            });
        }

        if(nextBtn) {
            nextBtn.addEventListener('click', () => {
                if (currentIndex < sessionData.length - 1) {
                    renderSlide(++currentIndex);
                } else {
                    alert("Lesson 16 Completed! Excellent work today.");
                }
            });
        }

        renderSlide(0);
    });

    function populateNavMenu() {
        if(!navMenuList) return;
        navMenuList.innerHTML = sessionData.map((data, index) => `
            <button onclick="goToSlide(${index})" class="nav-item-btn w-full text-left p-3 mb-1 rounded-xl hover:bg-white transition-all flex items-center gap-3 border border-transparent shadow-sm">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 text-sm font-bold text-white shadow-sm ${data.themeClass || ''}">
                    ${index + 1}
                </div>
                <div>
                    <div class="text-sm font-bold text-gray-800 leading-tight">${data.title ? data.title.substring(3) : 'Section ' + (index + 1)}</div>
                    <div class="text-[10px] font-bold uppercase tracking-wider ${data.iconColor || ''}">${data.type || 'Lesson'}</div>
                </div>
            </button>
        `).join('');
    }

    window.goToSlide = function(index) {
        currentIndex = index;
        renderSlide(currentIndex);
        if(navDropdown) navDropdown.classList.add('hidden');
    };

    function renderSlide(index) {
        pauseAllTimers();
        const data = sessionData[index];
        if(!headerEl || !titleEl || !containerEl) return;
        
        headerEl.className = `text-white p-4 shadow-lg transition-colors duration-700 z-20 relative ${data.themeClass}`;
        titleEl.textContent = data.title;
        
        const progressPercent = ((index + 1) / sessionData.length) * 100;
        if(progressBarEl) progressBarEl.style.width = `${progressPercent}%`;
        if(indicatorEl) indicatorEl.textContent = `Section ${index + 1} of ${sessionData.length}`;

        document.querySelectorAll('.nav-item-btn').forEach((btn, i) => {
            if (i === index) {
                btn.classList.add('bg-white', 'border-teal-200', 'shadow-md');
                btn.classList.remove('border-transparent', 'shadow-sm');
            } else {
                btn.classList.remove('bg-white', 'border-teal-200', 'shadow-md');
                btn.classList.add('border-transparent', 'shadow-sm');
            }
        });

        containerEl.innerHTML = ''; 
        setTimeout(() => {
            containerEl.innerHTML = data.content;
            
            if(data.id === 'speaking_u5_p2_apology') {
                updateTimerUI('prep1', timers.prep1.remaining);
                updateTimerUI('speak1', timers.speak1.remaining);
            }
            if(data.id === 'speaking_u5_p2_achievement') {
                updateTimerUI('prep2', timers.prep2.remaining);
                updateTimerUI('speak2', timers.speak2.remaining);
            }
        }, 10);

        if(prevBtn) prevBtn.disabled = index === 0;
        if(nextBtn) nextBtn.innerHTML = index === sessionData.length - 1 ? 
            'Finish Lesson <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : 
            'Next Section <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
    }

    window.toggleInlineAnswers = function(containerId, btnId) {
        const container = document.getElementById(containerId);
        const btn = document.getElementById(btnId);
        if(container) {
            container.classList.toggle('show-answers');
            if(container.classList.contains('show-answers')) {
                container.classList.add('shadow-md', 'border-emerald-300');
            } else {
                container.classList.remove('shadow-md', 'border-emerald-300');
            }
            if(btn) {
                btn.textContent = container.classList.contains('show-answers') ? 'Hide Answer' : 'Show Answer';
                btn.classList.toggle('bg-white');
                btn.classList.toggle('bg-emerald-100');
                btn.classList.toggle('text-gray-700');
                btn.classList.toggle('text-emerald-800');
            }
        }
    }

    window.toggleVisibility = function(id) {
        const el = document.getElementById(id);
        if(el) {
            if(el.classList.contains('hidden')){
                el.classList.remove('hidden');
                el.classList.add('fade-in');
                setTimeout(() => { el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
            } else {
                el.classList.add('hidden');
                el.classList.remove('fade-in');
            }
        }
    };
</script>
