    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimerUI(id, seconds) {
        const displayEl = document.getElementById(`${id}-timer`);
        if (displayEl) displayEl.textContent = formatTime(seconds);
    }

    function toggleTimer(id, defaultTime) {
        const timer = timers[id];
        const btn = document.getElementById(`btn-${id}-timer`);
        
        if (timer.isRunning) {
            clearInterval(timer.interval);
            timer.isRunning = false;
            if(btn) btn.textContent = 'Resume';
        } else {
            if (timer.remaining <= 0) timer.remaining = defaultTime;
            
            timer.isRunning = true;
            if(btn) btn.textContent = 'Pause';
            
            timer.interval = setInterval(() => {
                timer.remaining--;
                updateTimerUI(id, timer.remaining);
                
                if (timer.remaining <= 0) {
                    clearInterval(timer.interval);
                    timer.isRunning = false;
                    if(btn) btn.textContent = 'Time Up!';
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const playBeep = (st) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.frequency.setValueAtTime(800, st);
                            gain.gain.setValueAtTime(0.1, st);
                            osc.start(st);
                            gain.gain.exponentialRampToValueAtTime(0.00001, st + 0.3);
                            osc.stop(st + 0.3);
                        };
                        playBeep(ctx.currentTime);
                        playBeep(ctx.currentTime + 0.4);
                    } catch(e) {}
                }
            }, 1000);
        }
    }

        const timer = timers[id];

                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[Direct Answer]</span> "I wouldn't necessarily say there are 'more' beautiful things today; rather, the concept and medium of beauty have simply evolved over time.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[The Past]</span> In the past, people highly valued natural beauty or <span class="font-semibold text-blue-600">exquisite</span>, hand-crafted items like pottery or woven fabrics that required <span class="font-semibold text-blue-600">meticulous</span> artisanal work.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[The Present]</span> Today, however, we are surrounded by technological aesthetics. We find beauty in a sleek smartphone design, breathtaking digital art, or cutting-edge modern architecture.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[Conclusion]</span> So, while the volume of mass-produced items has increased, genuine beauty hasn't multiplied; it just caters to modern <span class="font-semibold text-blue-600">aesthetic</span> preferences."</p>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-2xl p-5 border border-gray-200">
                                <div class="flex justify-between items-start gap-4 mb-3">
                                    <p class="font-bold text-gray-800 text-lg">5. What beautiful scenery spots are there in your country?</p>
                                    <button onclick="toggleVisibility('p3-u2-5')" class="text-xs font-bold text-emerald-600 bg-emerald-100 hover:bg-emerald-200 px-4 py-2 rounded-lg transition-colors whitespace-nowrap shadow-sm">Sample</button>
                                </div>
                                <div id="p3-u2-5" class="hidden bg-white border-l-4 border-emerald-400 p-4 rounded-r-lg shadow-sm mt-3">
                                    <div class="space-y-2">
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[General Statement]</span> "My country, Vietnam, is blessed with incredibly diverse and breathtaking landscapes from north to south.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[Example 1]</span> For instance, Ha Long Bay is a <span class="font-semibold text-blue-600">prominent</span> spot renowned globally for its magnificent limestone karsts jutting dramatically out of emerald waters; it is exceptionally <span class="font-semibold text-blue-600">pleasing</span> to the eye.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[Example 2]</span> Meanwhile, in the mountainous regions, the terraced rice fields in Sapa are absolutely stunning, especially when they turn a <span class="font-semibold text-blue-600">brilliantly</span> golden color during the harvest season.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[Conclusion]</span> These spots not only attract millions of tourists but also hold deep <span class="font-semibold text-blue-600">sentimental</span> value for the locals."</p>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-2xl p-5 border border-gray-200">
                                <div class="flex justify-between items-start gap-4 mb-3">
                                    <p class="font-bold text-gray-800 text-lg">6. Where do you think people usually come into contact with beautiful things?</p>
                                    <button onclick="toggleVisibility('p3-u2-6')" class="text-xs font-bold text-emerald-600 bg-emerald-100 hover:bg-emerald-200 px-4 py-2 rounded-lg transition-colors whitespace-nowrap shadow-sm">Sample</button>
                                </div>
                                <div id="p3-u2-6" class="hidden bg-white border-l-4 border-emerald-400 p-4 rounded-r-lg shadow-sm mt-3">
                                    <div class="space-y-2">
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[Direct Answer]</span> "People encounter beauty in a multitude of settings, both man-made and natural.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[Aspect 1: Man-made]</span> In urban environments, people often come into contact with beauty in art galleries, museums, or even high-end boutiques where <span class="font-semibold text-blue-600">ornamental</span> and historical pieces are carefully curated and displayed.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[Aspect 2: Nature]</span> However, nature is arguably the most universal and accessible source of beauty. Just taking a stroll in a local botanical park allows one to appreciate <span class="font-semibold text-blue-600">vibrant</span> flowers, towering trees, or a picturesque sunset.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[Conclusion]</span> Ultimately, I believe people can find beauty anywhere if they have the right <span class="font-semibold text-blue-600">disposition</span> to look for it."</p>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-2xl p-5 border border-gray-200">
                                <div class="flex justify-between items-start gap-4 mb-3">
                                    <p class="font-bold text-gray-800 text-lg">7. Why do you think people create beautiful things?</p>
                                    <button onclick="toggleVisibility('p3-u2-7')" class="text-xs font-bold text-emerald-600 bg-emerald-100 hover:bg-emerald-200 px-4 py-2 rounded-lg transition-colors whitespace-nowrap shadow-sm">Sample</button>
                                </div>
                                <div id="p3-u2-7" class="hidden bg-white border-l-4 border-emerald-400 p-4 rounded-r-lg shadow-sm mt-3">
                                    <div class="space-y-2">
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[Direct Answer]</span> "I think creating beauty is fundamentally rooted in human nature.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[Reason 1: Self-Expression]</span> Primarily, it's a natural <span class="font-semibold text-blue-600">urge</span> to express ourselves, our inner emotions, and our unique <span class="font-semibold text-blue-600">disposition</span>. Whether through painting, architecture, or music, designing something <span class="font-semibold text-blue-600">aesthetic</span> allows individuals to manifest their thoughts into reality.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[Reason 2: Connection]</span> Furthermore, people create beautiful objects to leave a lasting mark on the world, to communicate complex emotions across generations, and to craft items that hold deep <span class="font-semibold text-blue-600">sentimental</span> value for others.</p>
                                        <p class="text-gray-700 italic text-sm leading-relaxed"><span class="text-xs font-bold text-emerald-600 uppercase tracking-wider not-italic mr-1 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100">[Conclusion]</span> In essence, it is our way of adding meaning and joy to the human experience."</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `
        }
    ];

    let currentIndex = 0;

    const headerEl = document.getElementById('app-header');
    const titleEl = document.getElementById('slide-title');
    const containerEl = document.getElementById('content-container');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const indicatorEl = document.getElementById('step-indicator');
    const progressBarEl = document.getElementById('progress-bar');
    const navDropdown = document.getElementById('nav-dropdown');
    const navMenuList = document.getElementById('nav-menu-list');

    function populateNavMenu() {
        navMenuList.innerHTML = sessionData.map((data, index) => `
            <button onclick="goToSlide(${index})" class="nav-item-btn w-full text-left p-3 mb-1 rounded-xl hover:bg-white transition-all flex items-center gap-3 border border-transparent shadow-sm">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 text-sm font-bold text-white shadow-sm ${data.themeClass}">
                    ${index + 1}
                </div>
                <div>
                    <div class="text-sm font-bold text-gray-800 leading-tight">${data.title.substring(3)}</div>
                    <div class="text-[10px] font-bold uppercase tracking-wider ${data.iconColor}">${data.type}</div>
                </div>
            </button>
        `).join('');
    }

    window.goToSlide = function(index) {
        currentIndex = index;
        renderSlide(currentIndex);
        navDropdown.classList.add('hidden');
    };

    document.getElementById('nav-toggle-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        navDropdown.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
        if (!navDropdown.contains(e.target) && !document.getElementById('nav-toggle-btn').contains(e.target)) {
            navDropdown.classList.add('hidden');
        }
    });

    function showCompletionMessage() {
        const overlay = document.createElement('div');
        overlay.id = "completion-overlay";
        overlay.className = 'fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 flex items-center justify-center fade-in';
        
        const toast = document.createElement('div');
        toast.className = 'bg-white text-gray-800 p-8 rounded-3xl shadow-2xl flex flex-col items-center gap-4 text-center max-w-sm border border-gray-100 transform transition-all';
        toast.innerHTML = `
            <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-500 mb-2 shadow-inner">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-2xl font-black text-gray-800">Lesson Completed!</h2>
            <p class="font-medium text-gray-500">Great job on finishing Lesson 06. You can review the sections from the menu.</p>
            <button onclick="document.getElementById('completion-overlay').remove()" class="mt-4 w-full px-6 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors shadow-sm">Close</button>
        `;
        
        overlay.appendChild(toast);
        document.body.appendChild(overlay);
    }

    function renderSlide(index) {
        if (typeof pauseAllTimers === 'function') pauseAllTimers();
        const data = sessionData[index];
        
        headerEl.className = `text-white p-4 shadow-lg transition-colors duration-700 z-20 relative ${data.themeClass}`;
        titleEl.textContent = data.title;
        
        const progressPercent = ((index + 1) / sessionData.length) * 100;
        progressBarEl.style.width = `${progressPercent}%`;
        indicatorEl.textContent = `Section ${index + 1} of ${sessionData.length}`;

        document.querySelectorAll('.nav-item-btn').forEach((btn, i) => {
            if (i === index) {
                btn.classList.add('bg-white', 'border-rose-200', 'shadow-md');
                btn.classList.remove('border-transparent', 'shadow-sm');
            } else {
                btn.classList.remove('bg-white', 'border-rose-200', 'shadow-md');
                btn.classList.add('border-transparent', 'shadow-sm');
            }
        });

        containerEl.innerHTML = ''; 
        setTimeout(() => {
            containerEl.innerHTML = data.content;
            if(data.id === 'speaking_practice_u2') {
                updateTimerUI('prep', timers.prep.remaining);
                updateTimerUI('speak', timers.speak.remaining);
                updateTimerUI('prep2', timers.prep2.remaining);
                updateTimerUI('speak2', timers.speak2.remaining);
            }
        }, 10);

        prevBtn.disabled = index === 0;
        nextBtn.innerHTML = index === sessionData.length - 1 ? 
            'Finish Lesson <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : 
            'Next Section <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
    }

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) renderSlide(--currentIndex);
    });

    nextBtn.addEventListener('click', () => {
        if (currentIndex < sessionData.length - 1) {
            renderSlide(++currentIndex);
        } else {
            showCompletionMessage();
        }
    });

    window.toggleVisibility = function(id) {
        const el = document.getElementById(id);
        if(el) {
            if(el.classList.contains('hidden')){
                el.classList.remove('hidden');
                el.classList.add('fade-in');
            } else {
                el.classList.add('hidden');
                el.classList.remove('fade-in');
            }
        }
    };

    window.toggleInlineAnswers = function(containerId, btnId) {
        const container = document.getElementById(containerId);
        const btn = document.getElementById(btnId);
        if(!container) return;
        
        const ansEls = container.querySelectorAll('.ans-inline');
        const blankEls = container.querySelectorAll('.blank-inline');
        
        let isShowing = false;
        
        ansEls.forEach(el => {
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                el.classList.add('fade-in');
                isShowing = true;
            } else {
                el.classList.add('hidden');
                el.classList.remove('fade-in');
                isShowing = false;
            }
        });
        
        blankEls.forEach(el => {
            if (isShowing) el.classList.add('hidden');
            else el.classList.remove('hidden');
        });
        
        if(btn) {
            btn.textContent = isShowing ? 'Hide Answers' : 'Show Answers';
        }
    };

    window.addEventListener('DOMContentLoaded', () => {
        populateNavMenu();
        renderSlide(0);
    });
</script>
</body>
</html>
