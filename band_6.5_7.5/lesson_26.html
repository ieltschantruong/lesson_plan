    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimerUI(id, seconds) {
        const displayEl = document.getElementById(`${id}-timer`);
        if (displayEl) displayEl.textContent = formatTime(seconds);
    }

    function toggleTimer(id, defaultTime) {
        const timer = timers[id];
        const btn = document.getElementById(`btn-${id}-timer`);
        
        if (timer.isRunning) {
            clearInterval(timer.interval);
            timer.isRunning = false;
            if(btn) btn.textContent = 'Resume';
        } else {
            if (timer.remaining <= 0) timer.remaining = defaultTime;
            
            timer.isRunning = true;
            if(btn) btn.textContent = 'Pause';
            
            timer.interval = setInterval(() => {
                timer.remaining--;
                updateTimerUI(id, timer.remaining);
                
                if (timer.remaining <= 0) {
                    clearInterval(timer.interval);
                    timer.isRunning = false;
                    if(btn) btn.textContent = 'Time Up!';
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const playBeep = (st) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.frequency.setValueAtTime(800, st);
                            gain.gain.setValueAtTime(0.1, st);
                            osc.start(st);
                            gain.gain.exponentialRampToValueAtTime(0.00001, st + 0.3);
                            osc.stop(st + 0.3);
                        };
                        playBeep(ctx.currentTime);
                        playBeep(ctx.currentTime + 0.4);
                    } catch(e) {}
                }
            }, 1000);
        }
    }

    function resetTimer(id, defaultTime) {
        const timer = timers[id];
        clearInterval(timer.interval);
        timer.isRunning = false;
        timer.remaining = defaultTime;
        updateTimerUI(id, defaultTime);
        const btn = document.getElementById(`btn-${id}-timer`);
        if(btn) btn.textContent = 'Start';
    }

        Object.keys(timers).forEach(key => {
            if (timers[key].isRunning) {

                                    <button onclick="toggleTimer('prep2', 60)" id="btn-prep2-timer" class="w-full bg-purple-200 text-purple-800 py-1.5 rounded-xl font-bold hover:bg-purple-300 transition-colors text-sm">Start</button>
                                </div>
                                <div class="bg-fuchsia-50 rounded-2xl p-4 border border-fuchsia-100 text-center flex-1 md:w-36 shadow-sm">
                                    <h4 class="text-fuchsia-600 font-bold uppercase text-[10px] tracking-wider mb-2">Speaking (2 Mins)</h4>
                                    <div class="text-3xl font-black text-fuchsia-600 timer-text mb-3 drop-shadow-sm" id="speak2-timer">02:00</div>
                                    <button onclick="toggleTimer('speak2', 120)" id="btn-speak2-timer" class="w-full bg-gradient-to-r from-fuchsia-500 to-purple-500 text-white py-1.5 rounded-xl font-bold hover:opacity-90 transition-opacity text-sm shadow-sm">Start</button>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-900 border-l-4 border-fuchsia-500 p-6 rounded-r-2xl shadow-sm text-slate-100">
                            <p class="text-fuchsia-400 font-bold uppercase tracking-wider text-xs mb-2">Candidate Task Card</p>
                            <p class="text-xl font-bold text-white mb-4">Describe a (recent) time when you looked at the sky (either day or night)</p>
                            <p class="text-slate-300 mb-2 font-medium">You should say:</p>
                            <ul class="text-slate-300 space-y-2 list-disc list-inside font-medium ml-2">
                                <li>What you were doing</li>
                                <li>When you looked at the sky</li>
                                <li>Who you were with</li>
                                <li>What you saw</li>
                                <li>And explain how you felt when you looked at the sky</li>
                            </ul>
                            <div class="mt-6 pt-5 border-t border-slate-700">
                                <button onclick="toggleVisibility('p2-2-sample')" class="text-xs font-bold text-slate-900 bg-fuchsia-200 hover:bg-fuchsia-300 px-4 py-2 rounded-lg transition-colors shadow-sm">Show Sample Response</button>
                                <div id="p2-2-sample" class="hidden mt-4 bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-inner">
                                    <p class="text-sm text-slate-200 italic leading-relaxed">"I'd like to share an unforgettable experience I had last summer when I went on a camping trip to a remote mountainous area. It was late August, and the primary purpose of the trip was to escape the suffocating heat and noise of the city.<br><br>Late one night, around midnight, I was sitting outside my tent with a few of my closest friends. We had just finished a barbecue and were simply chatting and enjoying the crisp mountain air. Because we were far away from any urban light pollution, the sky was pitch black and extraordinarily clear.<br><br>When I looked up, I was completely mesmerized. I saw thousands of stars glittering like scattered diamonds. For the first time in my life, I could faintly see the hazy, glowing band of the Milky Way stretching across the sky. We even managed to spot a couple of shooting stars, which prompted us to quickly make wishes.<br><br>Looking at that vast, starry canopy made me feel incredibly tiny, yet deeply connected to the universe. It was a humbling experience that put all my daily worries into perspective. The sheer beauty of the cosmos gave me an overwhelming sense of peace and tranquility that I still recall fondly today."</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `
        }
    ];

    let currentIndex = 0;

    const headerEl = document.getElementById('app-header');
    const titleEl = document.getElementById('slide-title');
    const containerEl = document.getElementById('content-container');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const indicatorEl = document.getElementById('step-indicator');
    const progressBarEl = document.getElementById('progress-bar');
    const navDropdown = document.getElementById('nav-dropdown');
    const navMenuList = document.getElementById('nav-menu-list');

    window.addEventListener('DOMContentLoaded', () => {
        populateNavMenu();
        
        document.getElementById('nav-toggle-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            navDropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!navDropdown.contains(e.target) && !document.getElementById('nav-toggle-btn').contains(e.target)) {
                navDropdown.classList.add('hidden');
            }
        });

        if(prevBtn) {
            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) renderSlide(--currentIndex);
            });
        }

        if(nextBtn) {
            nextBtn.addEventListener('click', () => {
                if (currentIndex < sessionData.length - 1) {
                    renderSlide(++currentIndex);
                } else {
                    alert("Lesson 26 Completed! Excellent work today.");
                }
            });
        }

        renderSlide(0);
    });

    function populateNavMenu() {
        if(!navMenuList) return;
        navMenuList.innerHTML = sessionData.map((data, index) => `
            <button onclick="goToSlide(${index})" class="nav-item-btn w-full text-left p-3 mb-1 rounded-xl hover:bg-white transition-all flex items-center gap-3 border border-transparent shadow-sm">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 text-sm font-bold text-white shadow-sm ${data.themeClass || ''}">
                    ${index + 1}
                </div>
                <div>
                    <div class="text-sm font-bold text-gray-800 leading-tight">${data.title ? data.title.substring(3) : 'Section ' + (index + 1)}</div>
                    <div class="text-[10px] font-bold uppercase tracking-wider ${data.iconColor || ''}">${data.type || 'Lesson'}</div>
                </div>
            </button>
        `).join('');
    }

    window.goToSlide = function(index) {
        currentIndex = index;
        renderSlide(currentIndex);
        if(navDropdown) navDropdown.classList.add('hidden');
    };

    function renderSlide(index) {
        pauseAllTimers();
        const data = sessionData[index];
        if(!headerEl || !titleEl || !containerEl) return;
        
        headerEl.className = `text-white p-4 shadow-lg transition-colors duration-700 z-20 relative ${data.themeClass}`;
        titleEl.textContent = data.title;
        
        const progressPercent = ((index + 1) / sessionData.length) * 100;
        if(progressBarEl) progressBarEl.style.width = `${progressPercent}%`;
        if(indicatorEl) indicatorEl.textContent = `Section ${index + 1} of ${sessionData.length}`;

        document.querySelectorAll('.nav-item-btn').forEach((btn, i) => {
            if (i === index) {
                btn.classList.add('bg-white', 'border-indigo-200', 'shadow-md');
                btn.classList.remove('border-transparent', 'shadow-sm');
            } else {
                btn.classList.remove('bg-white', 'border-indigo-200', 'shadow-md');
                btn.classList.add('border-transparent', 'shadow-sm');
            }
        });

        containerEl.innerHTML = ''; 
        setTimeout(() => {
            containerEl.innerHTML = data.content;
            
            // Restore timers visually if returning to slide
            if(data.id === 'speaking_u8_1') {
                updateTimerUI('prep1', timers.prep1.remaining);
                updateTimerUI('speak1', timers.speak1.remaining);
            }
            if(data.id === 'speaking_u8_2') {
                updateTimerUI('prep2', timers.prep2.remaining);
                updateTimerUI('speak2', timers.speak2.remaining);
            }
        }, 10);

        if(prevBtn) prevBtn.disabled = index === 0;
        if(nextBtn) nextBtn.innerHTML = index === sessionData.length - 1 ? 
            'Finish Lesson <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : 
            'Next Section <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
    }

    window.toggleInlineAnswers = function(containerId, btnId) {
        const container = document.getElementById(containerId);
        const btn = document.getElementById(btnId);
        if(container) {
            container.classList.toggle('show-answers');
            if(container.classList.contains('show-answers')) {
                container.classList.add('shadow-md', 'border-emerald-300');
            } else {
                container.classList.remove('shadow-md', 'border-emerald-300');
            }
            if(btn) {
                btn.textContent = container.classList.contains('show-answers') ? 'Hide Answer' : 'Show Answer';
                btn.classList.toggle('bg-white');
                btn.classList.toggle('bg-emerald-100');
                btn.classList.toggle('text-gray-700');
                btn.classList.toggle('text-emerald-800');
            }
        }
    }

    window.toggleVisibility = function(id) {
        const el = document.getElementById(id);
        if(el) {
            if(el.classList.contains('hidden')){
                el.classList.remove('hidden');
                el.classList.add('fade-in');
                setTimeout(() => { el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
            } else {
                el.classList.add('hidden');
                el.classList.remove('fade-in');
            }
        }
    };
</script>
</body>
</html>
