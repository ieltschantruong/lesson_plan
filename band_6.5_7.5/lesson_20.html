    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimerUI(id, seconds) {
        const displayEl = document.getElementById(`${id}-timer`);
        if (displayEl) displayEl.textContent = formatTime(seconds);
    }

    window.toggleTimer = function(id, defaultTime) {
        const timer = timers[id];
        const btn = document.getElementById(`btn-${id}-timer`);
        
        if (timer.isRunning) {
            clearInterval(timer.interval);
            timer.isRunning = false;
            if(btn) btn.textContent = 'Resume';
        } else {
            if (timer.remaining <= 0) timer.remaining = defaultTime;
            
            timer.isRunning = true;
            if(btn) btn.textContent = 'Pause';
            
            timer.interval = setInterval(() => {
                timer.remaining--;
                updateTimerUI(id, timer.remaining);
                
                if (timer.remaining <= 0) {
                    clearInterval(timer.interval);
                    timer.isRunning = false;
                    if(btn) btn.textContent = 'Time Up!';
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const playBeep = (st) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.frequency.setValueAtTime(800, st);
                            gain.gain.setValueAtTime(0.1, st);
                            osc.start(st);
                            gain.gain.exponentialRampToValueAtTime(0.00001, st + 0.3);
                            osc.stop(st + 0.3);
                        };
                        playBeep(ctx.currentTime);
                        playBeep(ctx.currentTime + 0.4);
                    } catch(e) {}
                }
            }, 1000);
        }
    };

        const timer = timers[id];

                                        <p class="text-sm text-slate-200 italic leading-relaxed">"I’d like to talk about a time I urgently needed to look up information for a university assignment. It was about two weeks ago, and my deadline was fast approaching, so I was definitely <strong>working against the clock</strong>. I was looking for credible academic papers regarding the impact of modern <strong>consumerism</strong> on the environment.<br><br>Initially, I searched on regular Google, but I was immediately <strong>overloaded with information</strong>. It was a chaotic mix of blogs, opinion pieces, and unverified data. I didn’t have the foggiest idea about which sources were genuinely <strong>credible</strong> and which were <strong>misleading</strong>. I was a bundle of nerves because I couldn't afford to include inaccurate data in my thesis.<br><br>Eventually, I realized I needed to be more strategic, so I <strong>turned to</strong> Google Scholar. This was a game-changer. It filtered out the noise and provided me with high-quality, peer-reviewed articles. Although the initial search was frustrating and made me feel completely drained, I ultimately felt a huge sense of relief when I found the exact data I needed. It taught me that while the internet is an infinite source of information, knowing *how* to search is <strong>of the essence</strong>."</p>

                                <div id="p3-q1" class="hidden mt-2 pt-2 border-t border-gray-200">
                                    <p class="text-sm text-gray-600 italic leading-relaxed">"The primary difference lies in the depth and recency of the information. Newspapers provide daily updates on current events, politics, and local happenings; they are designed for quick consumption. Conversely, libraries are archives of comprehensive, in-depth knowledge spanning centuries. You go to a newspaper to find out what happened yesterday, but you go to a library to conduct deep research on a subject."</p>
                                </div>
                            </div>
                            
                            <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 shadow-sm">
                                <div class="flex justify-between items-start gap-2 mb-3">
                                    <p class="font-bold text-gray-800 text-[15px]"><span class="text-teal-600 mr-2">2.</span> In what ways can people get information these days?</p>
                                </div>
                                <button onclick="toggleVisibility('p3-q2')" class="text-[10px] font-bold text-teal-600 bg-teal-100 hover:bg-teal-200 px-3 py-1.5 rounded transition-colors mb-2">Show Sample</button>
                                <div id="p3-q2" class="hidden mt-2 pt-2 border-t border-gray-200">
                                    <p class="text-sm text-gray-600 italic leading-relaxed">"Today, the avenues for gathering information are virtually limitless. The most prevalent method is, of course, the internet via smartphones and computers—using search engines, social media platforms, or dedicated news apps. However, traditional media like television broadcasts, radio, and print newspapers still play a significant role, particularly for older generations."</p>
                                </div>
                            </div>

                            <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 shadow-sm md:col-span-2">
                                <div class="flex justify-between items-start gap-2 mb-3">
                                    <p class="font-bold text-gray-800 text-[15px]"><span class="text-teal-600 mr-2">3.</span> What are the advantages and disadvantages of getting information on the Internet?</p>
                                </div>
                                <button onclick="toggleVisibility('p3-q3')" class="text-[10px] font-bold text-teal-600 bg-teal-100 hover:bg-teal-200 px-3 py-1.5 rounded transition-colors mb-2">Show Sample</button>
                                <div id="p3-q3" class="hidden mt-2 pt-2 border-t border-gray-200">
                                    <p class="text-sm text-gray-600 italic leading-relaxed">"The main advantage is undoubtedly convenience; users can access an infinite source of information across various disciplines from the comfort of their homes with just a mouse click. It's incredibly fast and mostly free. However, the demerits are significant. The sheer volume of data can be overwhelming, and more alarmingly, the internet is rife with the dissemination of misleading information and fake news. Therefore, users must possess strong critical thinking skills to verify the credibility of their sources."</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `
        }
    ];

    let currentIndex = 0;

    const headerEl = document.getElementById('app-header');
    const titleEl = document.getElementById('slide-title');
    const containerEl = document.getElementById('content-container');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const indicatorEl = document.getElementById('step-indicator');
    const progressBarEl = document.getElementById('progress-bar');
    const navDropdown = document.getElementById('nav-dropdown');
    const navMenuList = document.getElementById('nav-menu-list');

    window.addEventListener('DOMContentLoaded', () => {
        populateNavMenu();
        
        document.getElementById('nav-toggle-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            navDropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!navDropdown.contains(e.target) && !document.getElementById('nav-toggle-btn').contains(e.target)) {
                navDropdown.classList.add('hidden');
            }
        });

        if(prevBtn) {
            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) renderSlide(--currentIndex);
            });
        }

        if(nextBtn) {
            nextBtn.addEventListener('click', () => {
                if (currentIndex < sessionData.length - 1) {
                    renderSlide(++currentIndex);
                } else {
                    alert("Lesson 20 Completed! Excellent work today.");
                }
            });
        }

        renderSlide(0);
    });

    function populateNavMenu() {
        if(!navMenuList) return;
        navMenuList.innerHTML = sessionData.map((data, index) => `
            <button onclick="goToSlide(${index})" class="nav-item-btn w-full text-left p-3 mb-1 rounded-xl hover:bg-white transition-all flex items-center gap-3 border border-transparent shadow-sm">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 text-sm font-bold text-white shadow-sm ${data.themeClass || ''}">
                    ${index + 1}
                </div>
                <div>
                    <div class="text-sm font-bold text-gray-800 leading-tight">${data.title ? data.title.substring(3) : 'Section ' + (index + 1)}</div>
                    <div class="text-[10px] font-bold uppercase tracking-wider ${data.iconColor || ''}">${data.type || 'Lesson'}</div>
                </div>
            </button>
        `).join('');
    }

    window.goToSlide = function(index) {
        currentIndex = index;
        renderSlide(currentIndex);
        if(navDropdown) navDropdown.classList.add('hidden');
    };

    function renderSlide(index) {
        if (typeof pauseAllTimers === 'function') pauseAllTimers();
        const data = sessionData[index];
        if(!headerEl || !titleEl || !containerEl) return;
        
        headerEl.className = `text-white p-4 shadow-lg transition-colors duration-700 z-20 relative ${data.themeClass}`;
        titleEl.textContent = data.title;
        
        const progressPercent = ((index + 1) / sessionData.length) * 100;
        if(progressBarEl) progressBarEl.style.width = `${progressPercent}%`;
        if(indicatorEl) indicatorEl.textContent = `Section ${index + 1} of ${sessionData.length}`;

        document.querySelectorAll('.nav-item-btn').forEach((btn, i) => {
            if (i === index) {
                btn.classList.add('bg-white', 'border-teal-200', 'shadow-md');
                btn.classList.remove('border-transparent', 'shadow-sm');
            } else {
                btn.classList.remove('bg-white', 'border-teal-200', 'shadow-md');
                btn.classList.add('border-transparent', 'shadow-sm');
            }
        });

        containerEl.innerHTML = ''; 
        setTimeout(() => {
            containerEl.innerHTML = data.content;
            
            if(data.id === 'speaking_unit6') {
                updateTimerUI('prep1', timers.prep1.remaining);
                updateTimerUI('speak1', timers.speak1.remaining);
            }
        }, 10);

        if(prevBtn) prevBtn.disabled = index === 0;
        if(nextBtn) nextBtn.innerHTML = index === sessionData.length - 1 ? 
            'Finish Lesson <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : 
            'Next Section <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
    }

    window.toggleInlineAnswers = function(containerId, btnId) {
        const container = document.getElementById(containerId);
        const btn = document.getElementById(btnId);
        if(container) {
            container.classList.toggle('show-answers');
            if(container.classList.contains('show-answers')) {
                container.classList.add('bg-emerald-50/30', 'border-emerald-200');
            } else {
                container.classList.remove('bg-emerald-50/30', 'border-emerald-200');
            }
            if(btn) {
                btn.textContent = container.classList.contains('show-answers') ? 'Hide Answers' : 'Show Answers';
                btn.classList.toggle('bg-white');
                btn.classList.toggle('bg-emerald-100');
                btn.classList.toggle('text-gray-700');
                btn.classList.toggle('text-emerald-800');
                btn.classList.toggle('border-gray-300');
                btn.classList.toggle('border-emerald-300');
            }
        }
    }

    window.toggleVisibility = function(id) {
        const el = document.getElementById(id);
        if(el) {
            if(el.classList.contains('hidden')){
                el.classList.remove('hidden');
                el.classList.add('fade-in');
                setTimeout(() => { el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
            } else {
                el.classList.add('hidden');
                el.classList.remove('fade-in');
            }
        }
    };
</script>
</body>
</html>
