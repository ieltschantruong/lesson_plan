    /* ============ TEMPLATE BUILDERS ============ */
    function answerKeyHTML(answers, evidence) {
        if (!answers || !answers.length) {
            return `<div class="bg-white border border-dashed border-cyan-200 rounded-xl p-6 text-center text-sm text-gray-400 font-medium">Answer keys will be added soon.</div>`;
        }
        return `<div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3 text-sm text-gray-700 font-medium">` +
            answers.map(x => `<div class="bg-white p-2.5 rounded-lg border border-gray-100 shadow-sm ${x.wide ? 'sm:col-span-2' : ''}"><span class="text-cyan-500 font-bold mr-2">${x.n}</span> ${x.a}</div>`).join('') +
            `</div>` +
            (evidence ? `<details class="mt-5 bg-white border border-gray-100 rounded-xl p-4 shadow-sm"><summary class="cursor-pointer text-sm font-bold text-cyan-700">Evidence from the passage</summary><div class="mt-3 space-y-2 text-sm text-gray-600">` +
                Object.entries(evidence).map(([k,v]) => `<p><span class="text-cyan-500 font-bold mr-2">${k}</span><span class="italic">${v}</span></p>`).join('') + `</div></details>` : '');
    }

    function openLink(url, label) {
        return `<a href="${url}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-cyan-600 hover:text-white hover:bg-cyan-500 transition-colors px-4 py-1 bg-cyan-50 rounded-full shadow-sm border border-cyan-200 text-xs font-bold" title="${label}">${EXT_ICON} ${label}</a>`;
    }

    function iframeBox(url, title) {
        return `<div class="w-full rounded-2xl overflow-hidden border border-gray-200 shadow-inner bg-gray-50 relative min-h-[600px] shrink-0">
                    <iframe src="${url}" class="absolute inset-0 w-full h-full border-0" title="${title}" loading="lazy"></iframe>
                </div>`;
    }

                        <div class="flex items-center gap-3 mb-1 flex-wrap">
                            <h3 class="text-xl md:text-2xl font-bold text-gray-800">Reading ${key.toUpperCase()}</h3>
                            ${openLink(cfg.passageUrl, 'Open in New Tab')}
                        </div>
                        <p class="text-cyan-600 font-medium text-sm">Unit 10 | ${cfg.label}</p>
                    </div>
                </div>
                <button onclick="toggleVisibility('${ansId}')" class="w-full md:w-auto bg-cyan-50 text-cyan-700 px-5 py-2.5 rounded-xl font-bold hover:bg-cyan-100 transition-colors text-sm border border-cyan-200 flex justify-center items-center gap-2 shrink-0 shadow-sm">
                    ${EYE_ICON} Show Answer Keys
                </button>
            </div>

            <!-- Passage (mock view) -->
            <div class="flex flex-col gap-3">
                <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Passage &amp; Questions</p>
                ${iframeBox(cfg.passageUrl, 'Reading ' + key.toUpperCase() + ' Passage')}
            </div>

            <!-- Answer keys -->
            <div id="${ansId}" class="hidden bg-slate-50 border border-gray-200 rounded-2xl p-6 shrink-0 shadow-inner transition-all fade-in">
                <h4 class="font-bold text-cyan-800 mb-4 border-b border-cyan-100 pb-2 uppercase tracking-wide text-xs">Answer Key</h4>
                ${answerKeyHTML(cfg.answers, cfg.evidence)}
            </div>

            <!-- Vietnamese translation -->
            <div class="flex flex-col gap-3">
                <div class="flex items-center gap-3 flex-wrap">
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Bản dịch tiếng Việt</p>
                    ${openLink(cfg.translationUrl, 'Open Translation in New Tab')}
                </div>
                ${iframeBox(cfg.translationUrl, 'Reading ' + key.toUpperCase() + ' Vietnamese Translation')}
            </div>
        </div>`;
    }

    function chip(w) {
        return `<div class="bg-white border border-amber-200 rounded-xl px-3 py-2 text-center shadow-sm">
                    <div class="font-bold text-amber-700">${w[0]}</div>
                    <div class="text-xs text-gray-500">${w[1]}</div>
                    <div class="text-xs text-cyan-700 font-medium mt-0.5">${w[2]}</div>
                </div>`;
    }
    function blankify(t) {
        return t.replace(/\{\{(.+?)\}\}/g, (_, a) => `<span class="dots-slot text-gray-400">...........</span><span class="ans-slot ans-text">${a}</span>`);
    }
    function extraHTML(list) {
        if (!list) return '';
        return `<div class="mt-4"><p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Other useful words in this exercise</p>
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">${list.map(chip).join('')}</div></div>`;
    }

    function vocabHTML() {
        const blocks = vocabExercises.map(ex => {
            let body = '';
            if (ex.box) body += `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-5">${ex.box.map(chip).join('')}</div>`;
            if (ex.items) body += `<ol class="space-y-3 text-gray-700 list-decimal list-inside leading-relaxed">${ex.items.map(i => `<li>${blankify(i[0])}</li>`).join('')}</ol>`;
            if (ex.match) {
                body += `<div class="grid md:grid-cols-2 gap-6">
                    <ol class="space-y-2">${ex.match.left.map((w,i) => `<li class="flex flex-wrap items-baseline gap-x-2 bg-white border border-gray-100 rounded-xl px-3 py-2 shadow-sm"><span class="text-gray-400 font-bold">${i+1}</span><span class="font-bold text-amber-700">${w[0]}</span><span class="text-xs text-gray-500">${w[1]}</span><span class="text-xs text-cyan-700 font-medium">${w[2]}</span><span class="ml-auto"><span class="dots-slot text-gray-300">....</span><span class="ans-slot ans-badge">${ex.match.key[i]}</span></span></li>`).join('')}</ol>
                    <ul class="space-y-2">${ex.match.right.map(r => `<li class="bg-white border border-gray-100 rounded-xl px-3 py-2 shadow-sm"><span class="font-bold text-gray-500 mr-2">${r[0]}.</span><span class="text-gray-700">${r[1]}</span><div class="text-xs text-cyan-700 font-medium ml-6">${r[2]}</div></li>`).join('')}</ul>
                </div>`;
            }
            if (ex.image) {
                body += `<div class="grid lg:grid-cols-2 gap-6 items-start">
                    <ol class="space-y-2">${ex.words.map((w,i) => `<li class="flex flex-wrap items-baseline gap-x-2 bg-white border border-gray-100 rounded-xl px-3 py-2 shadow-sm"><span class="text-gray-400 font-bold">${i+1}</span><span class="font-bold text-amber-700">${w[0]}</span><span class="text-xs text-gray-500">${w[1]}</span><span class="text-xs text-cyan-700 font-medium">${w[2]}</span><span class="ml-auto"><span class="dots-slot text-gray-300">....</span><span class="ans-slot ans-badge">${w[3]}</span></span></li>`).join('')}</ol>
                    <img src="${ex.image}" alt="Exercise 3 pictures A–H" class="max-w-full sm:max-w-sm rounded-xl border border-gray-100 shadow-sm mx-auto">
                </div>`;
            }
            if (ex.choices) {
                body += `<ol class="space-y-5 text-gray-700 list-decimal list-inside">${ex.choices.map(c => `<li>${c.stem}
                    <span class="inline-block text-xs text-gray-500 ml-1">${c.w[1]} · <span class="text-cyan-700 font-medium">${c.w[2]}</span></span>
                    <div class="ml-6 mt-2 space-y-1">${c.opts.map((o,i) => `<p class="opt ${i === c.k ? 'opt-correct' : ''}"><b class="mr-1">${'ab'[i]}.</b>${o}</p>`).join('')}</div>
                    <p class="ans-slot ml-6 mt-1 text-xs italic text-emerald-700">→ ${c.vi}</p></li>`).join('')}</ol>`;
            }
            const id = 'vocab-ex-' + ex.n;
            return `
            <div id="${id}" class="bg-slate-50/60 border border-gray-100 rounded-2xl p-5">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-2">
                    <h4 class="text-lg font-bold text-amber-700">Exercise ${ex.n}</h4>
                    <button onclick="toggleInline('${id}', this)" class="bg-cyan-50 text-cyan-700 px-4 py-1.5 rounded-xl font-bold hover:bg-cyan-100 transition-colors text-xs border border-cyan-200 flex items-center gap-2 shadow-sm">${EYE_ICON} Show Answers</button>
                </div>
                <p class="text-gray-600 mb-4">${ex.instr}</p>
                ${body}
                ${extraHTML(ex.extra)}
            </div>`;
        }).join('');

        return `
        <div id="vocab-all" class="fade-in bg-white rounded-3xl shadow-xl border border-cyan-50 p-5 md:p-6 flex flex-col flex-grow gap-5">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-100 pb-5 shrink-0">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-2xl bg-cyan-100 flex items-center justify-center text-cyan-600 flex-shrink-0 shadow-sm">${VOCAB_ICON}</div>
                    <div>
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800">Reading Vocabulary</h3>
                        <p class="text-cyan-600 font-medium text-sm">Every Drop Counts | Exercises 1–5 · IPA + Tiếng Việt</p>
                    </div>
                </div>
                <button onclick="toggleAllVocab(this)" class="bg-cyan-50 text-cyan-700 px-5 py-2.5 rounded-xl font-bold hover:bg-cyan-100 transition-colors text-sm border border-cyan-200 flex justify-center items-center gap-2 shadow-sm">${EYE_ICON} Show All Answers</button>
            </div>
            ${blocks}
        </div>`;
    }

    window.toggleInline = function(id, btn) {
        const el = document.getElementById(id);
        const on = el.classList.toggle('show-answers');
        btn.lastChild.textContent = on ? ' Hide Answers' : ' Show Answers';
    };
    window.toggleAllVocab = function(btn) {
        const exs = document.querySelectorAll('[id^="vocab-ex-"]');
        const on = btn.dataset.on !== '1';
        btn.dataset.on = on ? '1' : '0';
        exs.forEach(el => {
            el.classList.toggle('show-answers', on);
            const b = el.querySelector('button'); if (b) b.lastChild.textContent = on ? ' Hide Answers' : ' Show Answers';
        });
        btn.lastChild.textContent = on ? ' Hide All Answers' : ' Show All Answers';
    };

    /* ============ UNIT PLAN (Unit + Skill) ============ */
    const sessionData = [
        {
            id: 'u10_reading_vocab', type: 'Reading · Vocab',
            themeClass: 'bg-gradient-to-r from-cyan-500 to-blue-500', iconColor: 'text-cyan-500',
            title: '1. Reading Vocabulary',
            content: vocabHTML()
        },
        {
            id: 'u10_reading_sb', type: 'Reading · SB',
            themeClass: 'bg-gradient-to-r from-blue-500 to-indigo-600', iconColor: 'text-blue-500',
            title: '2. Reading SB',
            content: readingPracticeHTML('sb', unitConfig.sb)
        },
        {
            id: 'u10_reading_wb', type: 'Reading · WB',
            themeClass: 'bg-gradient-to-r from-indigo-500 to-violet-600', iconColor: 'text-indigo-500',
            title: '3. Reading WB',
            content: readingPracticeHTML('wb', unitConfig.wb)
        }
    ];

    let currentIndex = 0;

    const headerEl = document.getElementById('app-header');
    const titleEl = document.getElementById('slide-title');
    const containerEl = document.getElementById('content-container');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const indicatorEl = document.getElementById('step-indicator');
    const progressBarEl = document.getElementById('progress-bar');
    const navDropdown = document.getElementById('nav-dropdown');
    const navMenuList = document.getElementById('nav-menu-list');

    window.addEventListener('DOMContentLoaded', () => {
        populateNavMenu();

        document.getElementById('nav-toggle-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            navDropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!navDropdown.contains(e.target) && !document.getElementById('nav-toggle-btn').contains(e.target)) {
                navDropdown.classList.add('hidden');
            }
        });

        prevBtn.addEventListener('click', () => { if (currentIndex > 0) renderSlide(--currentIndex); });
        nextBtn.addEventListener('click', () => {
            if (currentIndex < sessionData.length - 1) renderSlide(++currentIndex);
            else alert("Unit 10 | Reading Completed! Excellent work today.");
        });

        renderSlide(0);
    });

    function populateNavMenu() {
        navMenuList.innerHTML = sessionData.map((data, index) => `
            <button onclick="goToSlide(${index})" class="nav-item-btn w-full text-left p-3 mb-1 rounded-xl hover:bg-gray-50 transition-all flex items-center gap-3 border border-transparent shadow-sm">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 text-sm font-bold text-white shadow-sm ${data.themeClass || ''}">${index + 1}</div>
                <div>
                    <div class="text-sm font-bold text-gray-800 leading-tight">${data.title.substring(3)}</div>
                    <div class="text-[10px] font-bold uppercase tracking-wider ${data.iconColor || ''}">${data.type}</div>
                </div>
            </button>
        `).join('');
    }

    window.goToSlide = function(index) {
        currentIndex = index;
        renderSlide(currentIndex);
        navDropdown.classList.add('hidden');
    };

    function renderSlide(index) {
        const data = sessionData[index];
        headerEl.className = `text-white p-4 shadow-lg transition-colors duration-700 z-20 relative ${data.themeClass}`;
        titleEl.textContent = 'Unit 10 | ' + data.title.substring(3);

        progressBarEl.style.width = `${((index + 1) / sessionData.length) * 100}%`;
        indicatorEl.textContent = `Section ${index + 1} of ${sessionData.length}`;

        document.querySelectorAll('.nav-item-btn').forEach((btn, i) => {
            if (i === index) {
                btn.classList.add('bg-white', 'border-gray-200', 'shadow-md');
                btn.classList.remove('border-transparent', 'shadow-sm');
            } else {
                btn.classList.remove('bg-white', 'border-gray-200', 'shadow-md');
                btn.classList.add('border-transparent', 'shadow-sm');
            }
        });

        document.getElementById('main-scroll-area').scrollTop = 0;

        containerEl.innerHTML = '';
        setTimeout(() => { containerEl.innerHTML = data.content; }, 10);

        prevBtn.disabled = index === 0;
        nextBtn.innerHTML = index === sessionData.length - 1
            ? 'Finish Unit <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>'
            : 'Next Section <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
    }

    window.toggleVisibility = function(id) {
        const el = document.getElementById(id);
        if (!el) return;
        if (el.classList.contains('hidden')) {
            el.classList.remove('hidden');
            el.classList.add('fade-in');
            setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
        } else {
            el.classList.add('hidden');
            el.classList.remove('fade-in');
        }
    };
</script>
</body>
</html>
